services:
  # ============================================================================
  # PostgreSQL 16 Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ledgerline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in environment}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ledgerline_network

  # ============================================================================
  # Redis 7 Cache & Rate Limiting Engine
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ledgerline-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ledgerline_network

  # ============================================================================
  # LedgerLine Backend API
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ledgerline-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgerline}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in environment}@postgres:5432/${POSTGRES_DB:-ledgerline}?schema=public
      REDIS_URL: redis://redis:6379
      REQUIRE_REDIS_IN_PRODUCTION: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set with at least 32 characters}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set with at least 32 characters}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET must be set with at least 32 characters}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:?ADMIN_BOOTSTRAP_SECRET must be set with at least 16 characters}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:5000/api/health\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on(\"error\", () => process.exit(1));'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ledgerline_network

  # ============================================================================
  # LedgerLine Frontend & Nginx Reverse Proxy
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ledgerline-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ledgerline_network

# ==============================================================================
# Persistent Storage Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==============================================================================
# Isolated Internal Network
# ==============================================================================
networks:
  ledgerline_network:
    driver: bridge

